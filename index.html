<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tao Pai Pai Game</title>
    <script src="phaser.min.js"></script>
    <script src="main.js"></script>
</head>
<body>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1200px;
            overflow: hidden;
            background-image: linear-gradient(45deg, #3023ae 0%, #ff0099 100%);
        }
        canvas {
            display: grid;
            place-items: center;
            height: 100vh;
        }
    </style>
</body>
</html>
